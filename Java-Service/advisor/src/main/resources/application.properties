spring.application.name=advisor

# PostgreSQL Konfiqurasiyası 
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:shopping_advisor_db}
spring.datasource.username=${DB_USER:Overlook}
spring.datasource.password=${DB_PASSWORD:!Rzayev777}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis Konfiqurasiyası
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Keş Məntiqi
spring.cache.type=redis
spring.cache.redis.cache-null-values=false
spring.cache.redis.time-to-live=3600000
server.port=8081
version: '3.8'

services:
  # 1. PostgreSQL Verilənlər Bazası
  db:
    image: postgres:15
    container_name: shopping_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shopping_net

  # 2. pgAdmin (Vizual idarəetmə paneli)
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - shopping_net

  # 3. Redis (Keşləmə Servisi) - YENİ ƏLAVƏ
  redis:
    image: redis:7-alpine
    container_name: shopping_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - shopping_net

  # 4. Python FastAPI Scraper Servisi - YENİ ƏLAVƏ
  python-service:
    build:
      context: ./Python-Service
      dockerfile: Dockerfile
    container_name: shopping_python_scraper
    restart: always
    ports:
      - "8000:8000"
    shm_size: "1gb"          # Chromium üçün, yoxsa səhifələr "Aw, Snap" ilə çökə bilər
    init: true               # qalan Chromium proseslərini (zombie) təmizləyir
    environment:
      - SCRAPER_HEADFUL=1              # Xvfb ilə headful rejim
      - SCRAPER_PLATFORM_TIMEOUT=28    # hər platforma üçün saniyə
      - SCRAPER_BLOCK_COOLDOWN=0       # sınaq zamanı 0 qoy, işləyəndən sonra 300 et
    volumes:
      - ./Python-Service/debug:/app/debug   # boş nəticədə screenshot və HTML buraya düşür
    networks:
      - shopping_net

  # 5. Java Spring Boot Backend - YENİ ƏLAVƏ
  java-backend:
    build:
      context: ./Java-Service/advisor
      dockerfile: Dockerfile
    container_name: shopping_java_service
    restart: always
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - PYTHON_SERVICE_URL=http://python-service:8000
    depends_on:
      - db
      - redis
      - python-service
    networks:
      - shopping_net

volumes:
  postgres_data:
  redis_data:

networks:
  shopping_net:
    driver: bridge